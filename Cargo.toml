[package]
name = "interleaf"
version = "0.4.0"
edition = "2024"
rust-version = "1.89"
description = "MCP server for LaTeX papers written by people and agents together, on Overleaf or any git remote"
license = "MIT"
repository = "https://github.com/happysky19/interleaf"
readme = "README.md"
keywords = ["latex", "overleaf", "mcp", "agent", "git"]
categories = ["command-line-utilities", "text-processing"]

[dependencies]
anyhow = "1.0.104"
regex = "1.13.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
similar = "3.2.1"
tempfile = "3.27.0"
toml = "1.2.2"
ureq = { version = "3.5.2", default-features = false, features = ["rustls", "json"] }

tungstenite = { version = "0.28", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
sha2 = "0.10"
html-escape = "0.2"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", default-features = false, features = ["socket"] }

[lints.rust]
unsafe_code = "forbid"
